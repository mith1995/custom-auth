name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/django-authnest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/django-authnest/pyproject.toml

      - name: Install package with dev tools
        run: pip install -e ".[dev]"

      - name: Check no missing migrations
        run: python -m django makemigrations --check --dry-run --settings=tests.settings

      - name: Run tests
        run: pytest --cov=authnest --cov-report=term-missing
