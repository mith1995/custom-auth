[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-authnest"
version = "0.1.0"
description = "Reusable Django REST auth: email/phone/username login, JWT, email verification, password flows, profile, soft delete."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mithalesh Pal", email = "mithleshpallearning@gmail.com" }]
keywords = ["django", "drf", "authentication", "jwt", "auth"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 5.1",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "django>=5.1",
    "djangorestframework",
    "djangorestframework-simplejwt",
    "pillow",
]

[project.urls]
Homepage = "https://github.com/mith1995/custom-auth"
Issues = "https://github.com/mith1995/custom-auth/issues"

[tool.setuptools.package-data]
authnest = ["templates/**/*"]

[tool.setuptools.packages.find]
include = ["authnest*"]

[project.optional-dependencies]
dev = ["pytest", "pytest-django", "pytest-cov"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]